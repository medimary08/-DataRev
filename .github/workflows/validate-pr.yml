name: Validate Bundle (PR)

# Runs on every PR targeting main. This is the gate — merge should be
# blocked (via branch protection) until this passes.
on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Bundle validate
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_BUNDLE_VAR_databricks_host: ${{ secrets.DATABRICKS_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t dev