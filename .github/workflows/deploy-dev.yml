name: Deploy to Databricks Dev

# Runs whenever a feature branch is merged into main (i.e. main gets a new push).
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Bundle deploy (dev)
    runs-on: ubuntu-latest
    environment: dev   # optional: maps to a GitHub Environment for approval/protection rules

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_BUNDLE_VAR_databricks_host: ${{ secrets.DATABRICKS_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t dev

      - name: Deploy bundle
        # This syncs the notebooks into the workspace AND creates/updates
        # framework_job from resources/framework_job.yml.
        run: databricks bundle deploy -t dev

      # Optional: uncomment to also trigger a run of the job right after deploy.
      # - name: Run framework_job
      #   run: databricks bundle run framework_job -t dev